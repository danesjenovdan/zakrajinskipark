apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zakrajinskipark
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - zakrajinskipark.djnd.si
        - zakrajinskipark.danesjenovdan.si
      secretName: zakrajinskipark-tls
  rules:
    - host: zakrajinskipark.djnd.si
      http: &http_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zakrajinskipark
                port:
                  number: 80
    - host: zakrajinskipark.danesjenovdan.si
      http: *http_paths
